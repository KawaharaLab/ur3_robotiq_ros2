# Example configuration for data_capture_tools
output_root: /mnt/nvme1/tsumura/afterDICOMO/controlled_experiment
task_name: object11_ctrl
# Optional observations. specimen_id defaults to task_name; no second JSON needed.
# These values are recorded only and never change target_diameter or motion.
# Unknown values stay null. Imperfect mounting/reused samples are permitted.
specimen_metadata:
  specimen_width_mm: null       # Measured sample width (mm)
  width_measurement_state: null # e.g. before clamping, unloaded
  clamp_gap_mm: null            # Measured clamp gap (mm), independent of sample width
  notes: ""                    # Optional mounting/state changes; exact use count not required
  # Low-frequency optional hardware labels; update only when known/changed.
  finger_id: null
  force_sensor_left_id: null
  force_sensor_right_id: null

prompt: ""
label: "ぷりぷり, puri-puri" #"ふかふか, fuka-fuka", "かちかち, kachi-kachi", "ぷにぷに, puni-puni", "ぷりぷり, puri-puri", "ふわふわ, fuwa-fuwa"
# "つるつる, tsuru-tsuru", "ぺたぺた, peta-peta", "さらさら, sara-sara", "ざらざら, zara-zara", "すべすべ, sube-sube", "ふさふさ, fusa-fusa", "もこもこ, moko-moko", "べたべた, beta-beta", "ねばねば, neba-neba", "ひんやり, hin-yari", "あつあつ, ats-atsu", "かちかち, kachi-kachi", "ぷにぷに, puni-puni", "ぷりぷり, puri-puri", "ふわふわ, fuwa-fuwa"
# 基本姿勢
# 低い方
initial_arm_pose: [99.25, -80.84, 73.19, -82.27, -90.10, 54.26]
base_tcp_pose:
  x: 0.16821
  y: -0.31254
  z: -0.06169
  rx: 1.193
  ry: 2.916
  rz: -0.009

# 高い方
# initial_arm_pose: [99.25, -79.62, 64.80, -75.11, -90.13, 54.22]
# base_tcp_pose:
#   x: 0.16822
#   y: -0.31252
#   z: -0.03628
#   rx: 1.193
#   ry: 2.916
#   rz: -0.010

# 実験パラメータ
target_diameter: 0.010 # 動作計画用の幅 (m)。初期位置に合わせて調整可能。実測幅とは独立。
gripper_offset: 0.000 # デバイス誤差 (m)
arm_offset: 0.003 # アームの位置誤差 (m)
push_depth: 0.004 # 固定深さ動作の既定値 (m)。ad等の各試行条件とは区別する。

# Loading speed policy. Use "fixed" for repeatability pilots; "random" keeps
# the existing data-augmentation behavior.
loading_speed_mode: fixed
fixed_loading_speed: 0.100
random_loading_speed_min: 0.050
random_loading_speed_max: 0.200

# センタリング・接触検知パラメータ
contact_threshold: 0.03      # 接触判定の閾値 (N)
contact_margin: 0.2        # 接触判定の余白 (N)
centering_step_grip: 0.001   # 探査時のグリッパ閉じ幅 (m)
centering_step_arm: 0.001    # 探査時のアーム移動幅 (m)
centering_min_step_arm: 0.0001   # 探査時のアーム移動幅の最小値 (m)
centering_min_step_grip: 0.0005   # 探査時のグリッパ閉じ幅の最小値 (m)
safe_margin: 0.015          # 接触前の事前アプローチ用余白 (m)  <-- ★追加

# viewer_topics:
#   - /camera_fixed/realsense2_camera/color/image_raw
#   - /camera_wrist/realsense2_camera/color/image_raw
viewer_topics: []
image_throttle_hz: 0
other_throttle_hz: 0
enable_image_compression: true
stop_key: q
bag_record:
  storage: sqlite3
  compression_mode: file
  compression_format: zstd
topics:
  # Raw commanded register targets; return events are not physical completion.
  - name: /robotiq_2f_gripper/command_event
    type: std_msgs/msg/String
    mode: csv
  - name: /robotiq_2f_gripper/initialization
    type: std_msgs/msg/String
    mode: csv
  - name: /robot_cmd
    type: std_msgs/msg/String
    mode: csv
  # Experimental af stages/status; original timestamps and trial IDs are in JSON.
  - name: /force_press_event
    type: std_msgs/msg/String
    mode: csv
  # Optional acquisition records. Published only with acquisition_records:=true.
  - name: /gelsight_mini_publisher_1/acquisition_timing
    type: std_msgs/msg/String
    mode: csv
  - name: /gelsight_mini_publisher_2/acquisition_timing
    type: std_msgs/msg/String
    mode: csv
  - name: /mms101_driver_1/acquisition_timing
    type: std_msgs/msg/String
    mode: csv
  - name: /mms101_driver_2/acquisition_timing
    type: std_msgs/msg/String
    mode: csv
  - name: /camera_wrist/realsense2_camera/color/image_raw
    type: sensor_msgs/msg/Image
    mode: image
    encoding: bgr8
  - name: /camera_fixed/realsense2_camera/color/image_raw
    type: sensor_msgs/msg/Image
    mode: image
    encoding: bgr8
  - name: /camera_wrist/realsense2_camera/color/metadata
    type: realsense2_camera_msgs/msg/Metadata
    mode: csv
  - name: /camera_fixed/realsense2_camera/color/metadata
    type: realsense2_camera_msgs/msg/Metadata
    mode: csv
  - name: /gelsight/left/image_raw
    type: sensor_msgs/msg/Image
    mode: image
    encoding: bgr8
  - name: /gelsight/right/image_raw
    type: sensor_msgs/msg/Image
    mode: image
    encoding: bgr8
  - name: /tf
    type: tf2_msgs/msg/TFMessage
    mode: csv
  - name: /tf_static
    type: tf2_msgs/msg/TFMessage
    mode: csv
  - name: /joint_states
    type: sensor_msgs/msg/JointState
    mode: csv
  - name: /scaled_joint_trajectory_controller/controller_state
    type: control_msgs/msg/JointTrajectoryControllerState
    mode: csv
  - name: /scaled_joint_trajectory_controller/joint_trajectory
    type: trajectory_msgs/msg/JointTrajectory
    mode: csv
  - name: /forward_position_controller/commands
    type: std_msgs/msg/Float64MultiArray
    mode: csv
  - name: /robotiq_2f_gripper/finger_distance_mm
    type: std_msgs/msg/Float32
    mode: csv
  # Packet-reception stamped raw status. g_po is driver-derived aperture state,
  # not indentation of the contacted object.
  - name: /robotiq_2f_gripper/status
    type: robotiq_2f_gripper_msgs/msg/GripperStatus
    mode: csv
  - name: /robotiq_2f_gripper/joint_states
    type: sensor_msgs/msg/JointState
    mode: csv
  - name: /robotiq_2f_gripper_action_goal
    type: std_msgs/msg/Float32MultiArray
    mode: csv
  - name: /force_torque/left
    type: geometry_msgs/msg/WrenchStamped
    mode: csv
  - name: /force_torque/right
    type: geometry_msgs/msg/WrenchStamped
    mode: csv
    # --- 以下の 3 行を追記 ---
  - name: /trial_marker
    type: std_msgs/msg/String
    mode: csv
  - name: /trial_event
    type: robotiq_2f_gripper_msgs/msg/TrialEvent
    mode: csv
  - name: /robot_action_event
    type: robotiq_2f_gripper_msgs/msg/RobotActionEvent
    mode: csv
  - name: /current_phase
    type: std_msgs/msg/Int32
    mode: csv

